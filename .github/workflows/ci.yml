name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # electron-builder install-app-deps 自带的 node-gyp 需要 distutils（Python 3.12 起移除）
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run docs:check
      - run: npm run native

  # Windows 移植（GAP-008）：只检查跨平台部分；跳过安装脚本（Electron 本体与 better-sqlite3 二进制在这几步用不到）
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: .vendor/sherpa-onnx-win
          key: sherpa-onnx-win-${{ hashFiles('scripts/build-native-win.cjs') }}
      - run: npm run diarize:win
      # 内置识别引擎（whisper.cpp 源码编译约几分钟）：缓存源码、构建目录与产物，版本不变就跳过
      - uses: actions/cache@v4
        with:
          path: |
            .vendor/whisper.cpp
            native/bin/mt-whisper.exe
            native/bin/.mt-whisper-win-version
          key: whisper-win-${{ hashFiles('scripts/build-whisper-win.cjs') }}
      - run: npm run whisper:win # 编译全部 Windows 助手（含 mt-diarize，首次下载 sherpa-onnx 静态库）
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
