appId: com.mytypeless.desktop
productName: MyTypeless
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
npmRebuild: false
afterPack: scripts/sign-app.cjs
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: build/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
mac:
  # Swift 助手与 mt-whisper / mt-diarize 都按 macOS 13.0 部署目标编译（scripts/build-native.sh），声明与实际一致（issue #59）
  minimumSystemVersion: 13.0
  extraResources:
    - from: native/bin
      to: bin
      filter:
        - "*"
        - "!*.exe"
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.plist
  darkModeSupport: true
  # 线上会议截取会议软件的声音（D-033，Core Audio process tap）：系统授权框里显示的用途说明；麦克风沿用 Electron 默认
  extendInfo:
    NSAudioCaptureUsageDescription: 线上会议时转写会议软件里对方的声音（只在本机处理，不上传）
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
# Windows（D-036）：安装包一键安装到当前用户（%LOCALAPPDATA%\Programs，不要管理员权限）；没有代码签名证书
win:
  icon: build/icon.png
  # 文件名带操作系统（win-x64），与其他平台的同架构包区分开
  artifactName: ${productName}-${version}-${env.MT_BUILD}-win-${arch}.${ext}
  extraResources:
    - from: native/bin
      to: bin
      filter:
        - "mt-*.exe"
        - "!*.old-*"
  target:
    - target: nsis
      arch:
        - x64
    # 解压即用版：数据同样在 %APPDATA%\MyTypeless（与安装版共用），只提示新版本、手动下载新的 zip
    - target: zip
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
# 在线更新（D-028）：生成 Contents/Resources/app-update.yml（electron-updater 下载时要读其中的缓存目录名）。
# 地址必须与 src/main/update-info.ts 的 DEFAULT_UPDATE_URL 一致（test/update.test.ts 校验）；上传由 npm run release 完成
publish:
  provider: generic
  url: https://github.com/cjx157791216/MyTypeless/releases/latest/download
  updaterCacheDirName: mytypeless-updater
# 安装包文件名带版本与构建号（构建号由 scripts/dist.cjs 设置，见 npm run dist）
artifactName: ${productName}-${version}-${env.MT_BUILD}-${arch}.${ext}
dmg:
  title: MyTypeless ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
